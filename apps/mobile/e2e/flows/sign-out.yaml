# E12 S2a and S2b: sign-out (in the More list since S4) asks first, then clears the device and returns straight to the sign-in
# screen with no browser window, after revoking the session on the server. After a relaunch the
# sign-in screen still shows, so no refresh token was left in the secure store.
appId: app.flump.mobile
---
- runScript:
    file: ../scripts/fixture.js
    env:
      SCENARIO: "{}"
- runFlow: ../subflows/launch-signed-out.yaml
- runFlow: ../subflows/sign-in-to-home.yaml
- tapOn:
    id: "tab-more"
- scrollUntilVisible:
    element:
      id: "more-sign-out"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "more-sign-out"
- extendedWaitUntil:
    visible: "Sign out of Flump\\?"
    timeout: 10000
- takeScreenshot: sign-out-confirm-${THEME}
# Cancel keeps the person signed in.
- tapOn:
    id: "android:id/button2"
# The More list is behind the dialog all along, so wait for the dialog itself to go.
- extendedWaitUntil:
    notVisible: "Sign out of Flump\\?"
    timeout: 10000
- assertVisible:
    id: "more-sign-out"
- runScript:
    file: ../scripts/assert-session.js
    env:
      SIGN_OUTS: "0"
- runFlow: ../subflows/sign-out.yaml
- runScript:
    file: ../scripts/assert-session.js
    env:
      SIGN_OUTS: "1"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Create account"
    timeout: 60000
- assertNotVisible:
    id: "home"
- takeScreenshot: signed-out-${THEME}
