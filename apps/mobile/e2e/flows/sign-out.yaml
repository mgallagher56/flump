# E12 S2a and S2b: sign-out asks first, then clears the device and returns straight to the sign-in
# screen with no browser window, after revoking the session on the server. After a relaunch the
# sign-in screen still shows, so no refresh token was left in the secure store.
appId: app.flump.mobile
---
- runScript:
    file: ../scripts/fixture.js
    env:
      SCENARIO: "{}"
- runFlow: ../subflows/launch-signed-out.yaml
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      AFTER: "You are signed in"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign out of Flump\\?"
    timeout: 10000
- takeScreenshot: sign-out-confirm-${THEME}
# Cancel keeps the person signed in.
- tapOn:
    id: "android:id/button2"
# "You are signed in" is behind the dialog all along, so wait for the dialog itself to go.
- extendedWaitUntil:
    notVisible: "Sign out of Flump\\?"
    timeout: 10000
- assertVisible: "You are signed in"
- runScript:
    file: ../scripts/assert-session.js
    env:
      SIGN_OUTS: "0"
- runFlow: ../subflows/sign-out.yaml
- runScript:
    file: ../scripts/assert-session.js
    env:
      SIGN_OUTS: "1"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Create account"
    timeout: 60000
- assertNotVisible: "You are signed in"
- takeScreenshot: signed-out-${THEME}
