# E12 S6: net worth history. From Home's link under the trend bars, the home owner's change since
# last month, the chart's summary and the months behind "Show data". Then a household with two recorded months
# (`twoMonths`), from the Accounts list: the change, and web's sentence in place of the chart.
# The runner runs it in light and in dark, stopping and settling the app first; no retries.
appId: app.flump.mobile
---
- runScript:
    file: ../scripts/fixture.js
    env:
      SCENARIO: '{"data": "owner"}'
- runFlow: ../subflows/launch-signed-out.yaml
- runFlow: ../subflows/sign-in-to-home.yaml
- extendedWaitUntil:
    visible:
      id: "home-view-history"
    timeout: 30000
- tapOn:
    id: "home-view-history"
- extendedWaitUntil:
    visible:
      id: "history-hero"
    timeout: 30000
- assertVisible:
    id: "history-chart-summary"
- assertNotVisible:
    id: "history-few-months"
- takeScreenshot: history-owner-${THEME}
# Two recorded months: no chart yet.
- runScript:
    file: ../scripts/scenario.js
    env:
      SCENARIO: '{"data": "twoMonths"}'
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home"
    timeout: 60000
- tapOn:
    id: "tab-accounts"
- extendedWaitUntil:
    visible:
      id: "accounts-view-history"
    timeout: 30000
- tapOn:
    id: "accounts-view-history"
- extendedWaitUntil:
    visible:
      id: "history-few-months"
    timeout: 30000
- assertVisible:
    id: "history-hero"
- takeScreenshot: history-two-months-${THEME}
