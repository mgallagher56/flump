# E12 S4: the tab bar and the More list. Signs in, visits each tab (Home, Accounts, Budget, Pay,
# More), opens More from the header's menu button and one More page, then a link the app does not
# know, with a screenshot of each.
# The runner runs it in light and in dark, stopping and settling the app first; no retries.
appId: app.flump.mobile
---
- runScript:
    file: ../scripts/fixture.js
    env:
      SCENARIO: "{}"
- runFlow: ../subflows/launch-signed-out.yaml
- runFlow: ../subflows/sign-in-to-home.yaml
- assertVisible:
    id: "tab-home"
# The five tabs share one row at the normal text size: each is to the right of the one before it,
# so a fifth tab pushed onto a second row (device check, 26 November 2026) fails here.
- assertVisible:
    id: "tab-accounts"
    rightOf:
      id: "tab-home"
- assertVisible:
    id: "tab-budget"
    rightOf:
      id: "tab-accounts"
- assertVisible:
    id: "tab-taxAndPay"
    rightOf:
      id: "tab-budget"
- assertVisible:
    id: "tab-more"
    rightOf:
      id: "tab-taxAndPay"
- assertNotVisible:
    id: "tab-more"
    below:
      id: "tab-home"
- takeScreenshot: tab-home-${THEME}
# Navigation is checked by test id; the placeholder's words once, on Pay. The button's words
# depend on whether the build has the web app's address, so the flow checks its id, not its label.
- tapOn:
    id: "tab-accounts"
# Accounts is the app's own list since S6.
- extendedWaitUntil:
    visible:
      id: "accounts-hero"
    timeout: 10000
- takeScreenshot: tab-accounts-${THEME}
# Budget is the app's own page since S10: the canned data has no budget, so its empty state.
- tapOn:
    id: "tab-budget"
- extendedWaitUntil:
    visible:
      id: "budget-empty"
    timeout: 10000
- takeScreenshot: tab-budget-${THEME}
- tapOn:
    id: "tab-taxAndPay"
- extendedWaitUntil:
    visible:
      id: "coming-soon-taxAndPay"
    timeout: 10000
- assertVisible: "This page is not in the app yet. You can use it on the Flump website."
- assertVisible:
    id: "coming-soon-open-website"
- takeScreenshot: tab-pay-${THEME}
# The header's menu button opens More, as web's phone top bar.
- tapOn:
    id: "header-menu"
- extendedWaitUntil:
    visible:
      id: "more-row-pension"
    timeout: 10000
- takeScreenshot: tab-more-${THEME}
- tapOn:
    id: "more-row-pension"
- extendedWaitUntil:
    visible:
      id: "coming-soon-pension"
    timeout: 10000
- takeScreenshot: more-page-${THEME}
# The stacked page's own Back button returns to More; then Home by its tab, check-in row and all.
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible:
      id: "more-row-pension"
    timeout: 10000
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "check-in-row-action"
    timeout: 30000
# A link the app does not know lands on the app's own page, never Expo Router's, with one way back.
- openLink: flump://nope
- extendedWaitUntil:
    visible:
      id: "page-not-found-action"
    timeout: 10000
- assertNotVisible: "Sitemap"
- takeScreenshot: link-not-found-${THEME}
- tapOn:
    id: "page-not-found-action"
- extendedWaitUntil:
    visible:
      id: "check-in-row-action"
    timeout: 30000
