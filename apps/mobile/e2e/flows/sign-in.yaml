# E12 S2a: sign-in through the WorkOS stand-in (PKCE in the browser sheet), the account check, and a
# relaunch that restores the session from the stored refresh token. THEME comes from the runner.
appId: app.flump.mobile
---
- runScript:
    file: ../scripts/fixture.js
    env:
      SCENARIO: "{}"
- runFlow: ../subflows/launch-signed-out.yaml
- assertVisible: "Privacy notice"
- assertVisible: "Terms of use"
- takeScreenshot: sign-in-${THEME}
- runFlow: ../subflows/sign-in-to-home.yaml
# The hero, not the loading blocks: `home` is on the screen while it loads too.
- extendedWaitUntil:
    visible:
      id: "home-hero"
    timeout: 30000
- takeScreenshot: signed-in-${THEME}
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home"
    timeout: 60000
