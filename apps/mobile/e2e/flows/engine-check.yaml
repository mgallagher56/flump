# E12 S1a, S2c: the device check (route `engine-check`) on Hermes, with screenshots of Welcome and
# the device check for the theme the runner set. Pass THEME (`light` or `dark`) with `-e`: a default
# in this file would override it.
# Needs a debug build, where __DEV__ is true: CI's `🤖 Mobile e2e (Android)` job runs it through
# e2e/run-android-flows.sh; by hand, `bunx expo run:android`, then
# `maestro test -e THEME=light e2e/flows/engine-check.yaml`.
appId: app.flump.mobile
---
- runScript:
    file: ../scripts/fixture.js
    env:
      SCENARIO: "{}"
# Signed out, so the first screen is sign-in, which links the dev screens in a debug build.
- runFlow: ../subflows/launch-signed-out.yaml
- takeScreenshot: welcome-${THEME}
- scrollUntilVisible:
    element: "Device check"
- tapOn: "Device check"
- assertVisible: "Hermes"
- assertVisible:
    text: "All vectors pass.*"
- assertVisible:
    text: "All formatting cases match.*"
- takeScreenshot: engine-check-${THEME}
