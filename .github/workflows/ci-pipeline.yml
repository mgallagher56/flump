name: 🤖 CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly dependency audit (Mondays 06:17 UTC): new advisories land without a code change.
  schedule:
    - cron: "17 6 * * 1"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; never cancel a push-to-main run mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; each job declares what it needs. actions: write is
# for the turborepo-gh-artifacts cache server, which every turbo job uses.
permissions:
  contents: read

jobs:
  lint:
    name: ⬣ Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: 🔬 Lint
        run: bun run lint

      - name: 🔐 Check no mock auth literals
        run: bun run check:auth

      - name: 📐 Check design laws
        run: bun run check:laws

      # Policy (E22): exit 1 (next tax year's rates missing or unconfirmed in time) fails
      # pull_request and schedule runs. On push to main it is only a warning, so Railway
      # "Wait for CI" deploys are never blocked by the calendar. Exit 3 is a warning anywhere.
      - name: 📅 Tax-year calendar guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          bun run check:tax-calendar 2>&1 | tee tax-calendar.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### 📅 Tax-year calendar guard"
            echo '```'
            cat tax-calendar.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) ;;
            3) echo "::warning title=Tax-year calendar::Next tax year's rates are due soon (see job summary and docs/runbooks/tax-year-update.md)." ;;
            1)
              if [ "$EVENT_NAME" = "push" ]; then
                echo "::warning title=Tax-year calendar::Next tax year's rates are overdue. Failing PRs and the weekly run; not failing push to main."
              else
                echo "::error title=Tax-year calendar::The next UK tax year's rates are missing or unconfirmed. See docs/runbooks/tax-year-update.md."
                exit 1
              fi
              ;;
            *) echo "::error title=Tax-year calendar::Guard script crashed (exit $code)."; exit 1 ;;
          esac

      # Advisory (E24-T10): report mode always exits 0. Strict mode is for launch day only.
      - name: 🚦 Launch-readiness report
        continue-on-error: true
        run: |
          {
            echo "### 🚦 Launch-readiness checklist (advisory)"
            bun run check:launch -- --markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧪 Test repo scripts
        run: bun run test:scripts

  check-types:
    name: 🔎 Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: 🔎 Type check all packages
        run: bun run check-types

  vitest:
    name: ⚡ Vitest Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # pull-requests: write is for the coverage report comment.
    permissions:
      actions: write
      contents: read
      pull-requests: write

    # Throwaway Postgres for the real-database migration suite. The job runs on the
    # runner (not in a container), so localhost:5432 reaches the service. The password
    # is a literal for this disposable container, not a secret. The database name must
    # contain "test" as a whole word, e.g. flump_ci_test (assertSafeTestDatabase). REQUIRE_DB_TESTS=1 makes the suite fail
    # at collection instead of skipping if TEST_DATABASE_URL ever goes missing.
    # turbo.json lists both variables under `env` for the test tasks so turbo passes
    # them to vitest and includes them in the task hash.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flump_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flump_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flump_ci_test
      REQUIRE_DB_TESTS: "1"

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: ⚡ Run vitest with coverage floors
        run: bun run test:coverage

      # Ops script tests (scripts/ops): the DB-backed ones run against the Postgres service above
      # through the runner's own psql. REQUIRE_DB_TESTS=1 makes them fail instead of skip.
      - name: 🧰 Run ops script tests
        run: bun test ./scripts/ops

      - name: "Report Coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2.13.2
        with:
          working-directory: "apps/web"
          threshold-icons: '{"0": "🔴", "80": "🟢"}'

  build:
    name: 🏗️ Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: 🏗️ Build all packages
        run: bun run build

  # E8 Storybook a11y gate. Non-required while it beds in: continue-on-error keeps a failure here
  # from turning the pipeline red.
  # Remove continue-on-error and make this job required on 2026-11-25 (owner: mgallagher56) if green on main for the two weeks before.
  # Light, dark and the build smoke run as parallel matrix legs, each through turbo so an
  # unchanged web app (and its workspace deps) replays from the remote cache.
  storybook-a11y:
    name: ♿ Storybook ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a11y (light)
            task: test:storybook
            browser: true
          - name: a11y (dark)
            task: test:storybook:dark
            browser: true
          # Smoke: the Storybook production build (--test) must still compile.
          - name: build smoke
            task: build-storybook:test
            browser: false

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: 🗂️ Cache Playwright browsers
        if: matrix.browser
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: 🌐 Install Chromium
        if: matrix.browser
        working-directory: apps/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      # turbo.json makes these tasks depend on ^build and generate, so the workspace packages
      # the stories import (e.g. @flump/finance-engine) are built (or replayed) first.
      - name: ♿ Storybook ${{ matrix.name }}
        run: bunx turbo run ${{ matrix.task }} --filter=@flump/web

  # A new workspace must never silently break the Railway images (E12 T2.23). The three
  # server Dockerfiles install only the workspaces they need; build them whenever a
  # manifest, the lockfile or a Dockerfile changes.
  docker-build:
    name: 🐳 Docker images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    # Throwaway database for the backend boot smoke below (fake credentials, CI only).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flump_ci
          POSTGRES_PASSWORD: flump-ci-not-a-secret
          POSTGRES_DB: flump_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U flump_ci -d flump_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 🔎 Did a manifest, lockfile or Dockerfile change?
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -E '(^|/)package\.json$|^bun\.lock$|^turbo\.json$|^\.npmrc$|(^|/)Dockerfile$|^\.dockerignore$|^\.github/workflows/ci-pipeline\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐳 Build backend, web and marketing images
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          for app in backend web marketing; do
            docker build -f "apps/$app/Dockerfile" -t "flump-$app-ci" .
          done

      - name: 🚫 No Expo or React Native in server images
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          for app in backend web marketing; do
            n=$(docker run --rm --entrypoint sh "flump-$app-ci" -c '(ls /app/node_modules; ls /app/node_modules/.bun 2>/dev/null) | grep -cE "^(expo|react-native)(@|$)" || true')
            [ "$n" = "0" ] || { echo "$app image contains Expo/React Native"; exit 1; }
          done

      - name: 🔒 Image hardening (non-root, healthcheck, no env files)
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          for app in backend web marketing; do
            img="flump-$app-ci"
            uid=$(docker run --rm --entrypoint id "$img" -u)
            [ "$uid" != "0" ] || { echo "$app image runs as root"; exit 1; }
            hc=$(docker inspect -f '{{.Config.Healthcheck}}' "$img")
            case "$hc" in ""|"<nil>") echo "$app image has no HEALTHCHECK"; exit 1 ;; esac
            envs=$(docker run --rm --entrypoint find "$img" /app -name '.env*' ! -name '.env.example')
            [ -z "$envs" ] || { echo "$app image contains env files:"; echo "$envs"; exit 1; }
          done

      # Boots the production image with NODE_ENV=production. Strict config resolution plus
      # migrationsRun mean the server only listens once the config is valid and every
      # migration has applied; /health/ready then proves the database answers.
      - name: 🚀 Backend container boot smoke
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          trap 'docker logs flump-backend-smoke 2>&1 | tail -n 60; docker rm -f flump-backend-smoke >/dev/null 2>&1 || true' EXIT
          key=$(openssl rand -hex 32)
          docker run -d --name flump-backend-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL=postgres://flump_ci:flump-ci-not-a-secret@127.0.0.1:5432/flump_ci \
            -e DB_SSL=false \
            -e BANKING_TOKEN_ENCRYPTION_KEY="$key" \
            -e WORKOS_CLIENT_ID=client_ci_dummy \
            -e CORS_ALLOWED_ORIGINS=https://example.invalid \
            flump-backend-ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/health/ready || true)
            [ "$code" = "200" ] && { echo "ready after ~$((i * 2))s"; exit 0; }
            [ "$(docker inspect -f '{{.State.Running}}' flump-backend-smoke)" = "true" ] || { echo "backend container exited"; exit 1; }
            sleep 2
          done
          echo "backend did not become ready within 60s"
          exit 1

  audit:
    name: 🛡️ Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup

      # Policy: exit 1 (real high/critical advisory) fails pull_request runs only; on
      # push-to-main and schedule it is reported loudly but does not fail the job, so
      # Railway "Wait for CI" deploys are never blocked by a new upstream advisory.
      # Exit 2 (registry outage / unreadable report, after one retry in the script) is a
      # warning on every event: an outage is not the PR's fault and must not turn main red.
      - name: 🛡️ Audit dependencies (high and critical block PRs)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          bun run check:audit 2>&1 | tee audit-output.txt
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0)
              echo "### 🛡️ Dependency audit: clean" >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              {
                echo "### 🛡️ Dependency audit: high or critical advisories found"
                echo ""
                echo '```'
                cat audit-output.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$EVENT_NAME" = "pull_request" ]; then
                echo "::error title=Dependency audit::High or critical advisories found (see job summary). Fix, upgrade, or add a time-boxed audit-allowlist.json entry."
                exit 1
              fi
              echo "::warning title=Dependency audit ($EVENT_NAME)::High or critical advisories found on ${GITHUB_REF_NAME}. Reported only so deploys are not blocked; triage promptly (see job summary)."
              ;;
            2)
              {
                echo "### 🛡️ Dependency audit: could not complete (exit $code)"
                echo ""
                echo '```'
                cat audit-output.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Dependency audit unavailable::bun audit could not produce a usable report after one retry (exit $code). Not failing the job; re-run or check the registry."
              ;;
            *)
              {
                echo "### 🛡️ Dependency audit: configuration error (exit $code)"
                echo ""
                echo '```'
                cat audit-output.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Dependency audit configuration::Allow-list or report shape is invalid (exit $code). This is a repo bug, not an outage: fix audit-allowlist.json or scripts/lib/audit.ts."
              exit 1
              ;;
          esac
