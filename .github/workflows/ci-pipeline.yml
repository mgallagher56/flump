name: 🤖 CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly dependency audit (Mondays 06:17 UTC): new advisories land without a code change.
  schedule:
    - cron: "17 6 * * 1"

env:
  # TEMP E41 P5 measurement: every task runs, no Turbo cache replay. Dropped before merge.
  TURBO_FORCE: "true"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; never cancel a push-to-main run mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# SEC-E (S7, S8), asserted by scripts/ci-config.test.ts: every checkout sets
# persist-credentials: false (no job pushes, so the token never needs to sit in .git/config), and
# every service and container image is pinned by digest. To bump a digest:
# docker buildx imagetools inspect <image>:<tag> and copy the index digest (Renovate does it too).
#
# Least privilege by default; each job declares what it needs. actions: write is
# for the turborepo-gh-artifacts cache server, which every turbo job uses.
permissions:
  contents: read

jobs:
  lint:
    name: ⬣ Lint & Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-openapi-breaking needs the merge base with main (BE-09)
          persist-credentials: false

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: 🔬 Lint
        run: bun run lint

      - name: 🔐 Check no mock auth literals
        run: bun run check:auth

      - name: 📐 Check design laws
        run: bun run check:laws

      # Policy (E22): exit 1 (next tax year's rates missing or unconfirmed in time) fails
      # pull_request and schedule runs. On push to main it is only a warning, so Railway
      # "Wait for CI" deploys are never blocked by the calendar. Exit 3 is a warning anywhere.
      - name: 📅 Tax-year calendar guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          bun run check:tax-calendar 2>&1 | tee tax-calendar.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### 📅 Tax-year calendar guard"
            echo '```'
            cat tax-calendar.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) ;;
            3) echo "::warning title=Tax-year calendar::Next tax year's rates are due soon (see job summary and docs/runbooks/tax-year-update.md)." ;;
            1)
              if [ "$EVENT_NAME" = "push" ]; then
                echo "::warning title=Tax-year calendar::Next tax year's rates are overdue. Failing PRs and the weekly run; not failing push to main."
              else
                echo "::error title=Tax-year calendar::The next UK tax year's rates are missing or unconfirmed. See docs/runbooks/tax-year-update.md."
                exit 1
              fi
              ;;
            *) echo "::error title=Tax-year calendar::Guard script crashed (exit $code)."; exit 1 ;;
          esac

      # Advisory (E24-T10): report mode always exits 0. Strict mode is for launch day only.
      - name: 🚦 Launch-readiness report
        continue-on-error: true
        run: |
          {
            echo "### 🚦 Launch-readiness checklist (advisory)"
            bun run check:launch -- --markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧪 Test repo scripts
        run: bun run test:scripts

      # Runs even when an earlier step failed, so one run still reports type errors too.
      - name: 🔎 Type check all packages
        if: ${{ !cancelled() }}
        run: bun run check-types

  # Vitest runs as two parallel shards (web, backend + packages) so neither is the critical path.
  # Both need the throwaway Postgres: the web unit project includes the backend contract suite
  # (apps/web/app/contract), which boots the backend against a real database.
  # Throwaway Postgres for the real-database suites. The job runs on the runner (not in a
  # container), so localhost:5432 reaches the service. The password is a literal for this
  # disposable container, not a secret. The database name must contain "test" as a whole word,
  # e.g. flump_ci_test (assertSafeTestDatabase). REQUIRE_DB_TESTS=1 makes the suites fail at
  # collection instead of skipping if TEST_DATABASE_URL ever goes missing. turbo.json lists both
  # variables under `env` for the test tasks so turbo passes them to vitest and includes them in
  # the task hash.
  vitest-shard:
    name: ⚡ Vitest ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # pull-requests: write is for the coverage report comment.
    permissions:
      actions: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            filter: "--filter=@flump/web"
          - name: backend and packages
            filter: "--filter=!@flump/web"

    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flump_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flump_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flump_ci_test
      REQUIRE_DB_TESTS: "1"

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: ⚡ Run vitest with coverage floors
        run: bunx turbo run test:coverage ${{ matrix.filter }}

      - name: "Report Coverage"
        if: always() && matrix.name == 'web'
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          working-directory: "apps/web"
          threshold-icons: '{"0": "🔴", "80": "🟢"}'

  # Stable required-check name: branch protection keeps pointing at "⚡ Vitest Tests" while the
  # work happens in the shards above.
  vitest:
    name: ⚡ Vitest Tests
    if: always() && github.event_name != 'schedule'
    needs: [vitest-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ✅ All Vitest shards passed
        env:
          RESULT: ${{ needs.vitest-shard.result }}
        run: |
          echo "vitest-shard: $RESULT"
          [ "$RESULT" = "success" ]

  # Ops script tests (scripts/ops): the DB-backed ones run against a Postgres service through the
  # runner's own psql. REQUIRE_DB_TESTS=1 makes them fail instead of skip. Only needs installed
  # dependencies, no turbo.
  ops-scripts:
    name: 🧰 Ops script tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flump_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flump_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flump_ci_test
      REQUIRE_DB_TESTS: "1"

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup

      - name: 🧰 Run ops script tests
        run: bun test ./scripts/ops

  build:
    name: 🏗️ Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: 🏗️ Build all packages
        run: bun run build

      - name: 📜 Generate workspace CycloneDX SBOM
        run: bun scripts/generate-sbom.ts --app workspace --root . --out sboms/sbom-workspace.cdx.json

      - name: 📎 Upload workspace CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-workspace
          path: sboms/sbom-workspace.cdx.json
          retention-days: 30

  # E8 Storybook a11y gate. Blocking since BE-01 (green on main through the bedding-in period
  # that ended 2026-11-25): both legs are required checks (.github/required-checks.json).
  # Light (plus the build smoke) and dark run as parallel matrix legs, each through turbo so an
  # unchanged web app (and its workspace deps) replays from the remote cache.
  storybook-a11y:
    name: ♿ Storybook ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The light leg also runs the build smoke: the Storybook production build (--test)
          # must still compile. It shares this leg's install, setup and turbo replay.
          - name: a11y (light)
            task: test:storybook
            smoke: true
          - name: a11y (dark)
            task: test:storybook:dark
            smoke: false

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: 🗂️ Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: 🌐 Install Chromium
        working-directory: apps/web
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-chromium.sh" "$CACHE_HIT"

      # turbo.json makes these tasks depend on ^build and generate, so the workspace packages
      # the stories import (e.g. @flump/finance-engine) are built (or replayed) first.
      - name: ♿ Storybook ${{ matrix.name }}
        run: bunx turbo run ${{ matrix.task }} --filter=@flump/web

      - name: 🏭 Storybook build smoke
        if: matrix.smoke
        run: bunx turbo run build-storybook:test --filter=@flump/web

  # Playwright smoke suite (apps/e2e): the built backend, web and marketing apps against a real
  # Postgres, signed in through the test-only cookie session (E2E_DEV_SESSION, development
  # builds only; see apps/e2e/README.md). Playwright starts the three servers itself.
  e2e-smoke:
    name: 🎭 E2E smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    # Throwaway Postgres; the password is a literal for this disposable container, not a secret.
    # The database name must contain the word e2e (apps/e2e refuses any other).
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flump_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flump_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flump_e2e

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup
        with:
          turbo: true
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          turboToken: ${{ env.TURBO_TOKEN }}

      - name: 🗂️ Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: 🌐 Install Chromium
        working-directory: apps/e2e
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-chromium.sh" "$CACHE_HIT"

      - name: 🏗️ Build all packages
        run: bun run build

      # Spawns the built apps/web server (server.ts) and checks headers on every response kind,
      # the query-free access log and graceful shutdown. Needs the build above.
      - name: 🛡️ Web server integration test
        run: bun run --cwd apps/web test:server

      # Retries are off (L10), so a flaky spec fails here instead of passing on a second try. A
      # spec parked in apps/e2e/quarantine.ts is skipped by the run and named in the job summary.
      - name: 🎭 Run E2E smoke tests
        run: bun run test:e2e

      - name: 🧾 Report quarantined specs
        if: ${{ !cancelled() }}
        run: bun apps/e2e/quarantine.ts >> "$GITHUB_STEP_SUMMARY"

      # Trace, screenshots and the HTML report only matter when something failed.
      - name: 📎 Upload Playwright report and traces
        if: failure()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # A change must never silently break the Railway images (E12 T2.23, BE-01 L10). The job is a
  # required check, so it always runs and reports; the build steps run whenever anything that
  # goes into an image changes (any app or package source, a manifest, the lockfile, a
  # Dockerfile or this workflow). Docs-only and mobile-only PRs pass in seconds.
  docker-build:
    name: 🐳 Docker images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Stands in for the web image's Sentry build token (see the build step). Not a secret.
      TOKEN_CANARY: flump-ci-canary-not-a-token

    # Throwaway database for the backend boot smoke below (fake credentials, CI only).
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: flump_ci
          POSTGRES_PASSWORD: flump-ci-not-a-secret
          POSTGRES_DB: flump_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U flump_ci -d flump_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔎 Did anything that goes into an image change?
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eo pipefail
          # Diff first, so a git error fails this required job instead of skipping the build.
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          # scripts/ and root tsconfig files: the image builds run root scripts (e.g. the
          # launch-placeholder guard) and extend the root TypeScript config.
          if printf '%s\n' "$changed" \
            | grep -E '^apps/(backend|web|marketing)/|^packages/|^scripts/|^tsconfig[^/]*\.json$|(^|/)package\.json$|^bun\.lock$|^turbo\.json$|^\.npmrc$|^\.dockerignore$|^\.github/(workflows/ci-pipeline\.yml|actions/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # The three builds run in parallel on one BuildKit daemon, which shares the identical
      # manifests and deps layers between them, so the job takes about as long as the slowest image.
      - name: 🐳 Build backend, web and marketing images
        if: steps.changed.outputs.run == 'true'
        run: |
          set -u
          pids=""
          # The web image takes its Sentry token as a build ARG (Railway cannot use secret mounts).
          # CI passes a canary in its place, with a dummy org and project so the Sentry plugin
          # really runs, and a dead loopback address so nothing can be uploaded (the plugin warns
          # and the build carries on). The next steps fail if the canary or a source map reached
          # the final image. Every value here is a fixed public string, not a secret.
          for app in backend web marketing; do
            if [ "$app" = "web" ]; then
              docker build --progress=plain --build-arg "SENTRY_AUTH_TOKEN=$TOKEN_CANARY" \
                --build-arg SENTRY_ORG=flump-ci --build-arg SENTRY_PROJECT=flump-ci \
                --build-arg SENTRY_URL=http://127.0.0.1:9 -f "apps/$app/Dockerfile" -t "flump-$app-ci" . > "docker-$app.log" 2>&1 &
            else
              docker build --progress=plain -f "apps/$app/Dockerfile" -t "flump-$app-ci" . > "docker-$app.log" 2>&1 &
            fi
            pids="$pids $!:$app"
          done
          failed=0
          for entry in $pids; do
            pid=${entry%%:*}; app=${entry#*:}
            if wait "$pid"; then
              echo "::group::$app image built"; tail -n 20 "docker-$app.log"; echo "::endgroup::"
            else
              echo "::error title=Docker build::$app image failed to build"; tail -n 80 "docker-$app.log"; failed=1
            fi
          done
          exit "$failed"

      - name: 🚫 No Expo or React Native in server images
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          for app in backend web marketing; do
            n=$(docker run --rm --entrypoint sh "flump-$app-ci" -c '(ls /app/node_modules; ls /app/node_modules/.bun 2>/dev/null) | grep -cE "^(expo|react-native)(@|$)" || true')
            [ "$n" = "0" ] || { echo "$app image contains Expo/React Native"; exit 1; }
          done

      - name: 🔒 Image hardening (non-root, healthcheck, no env files)
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          for app in backend web marketing; do
            img="flump-$app-ci"
            uid=$(docker run --rm --entrypoint id "$img" -u)
            [ "$uid" != "0" ] || { echo "$app image runs as root"; exit 1; }
            hc=$(docker inspect -f '{{.Config.Healthcheck}}' "$img")
            case "$hc" in ""|"<nil>") echo "$app image has no HEALTHCHECK"; exit 1 ;; esac
            envs=$(docker run --rm --entrypoint find "$img" /app -name '.env*' ! -name '.env.example')
            [ -z "$envs" ] || { echo "$app image contains env files:"; echo "$envs"; exit 1; }
            # S9: the runtime user owns nothing under /app and can write nowhere in it, so a
            # compromised server process cannot rewrite its own code.
            owned=$(docker run --rm --entrypoint sh "$img" -c 'find /app -user "$(id -u)" | head -n 5')
            [ -z "$owned" ] || { echo "$app image: files under /app are owned by the runtime user:"; echo "$owned"; exit 1; }
            writable=$(docker run --rm --entrypoint sh "$img" -c 'find /app -writable ! -type l | head -n 5')
            [ -z "$writable" ] || { echo "$app image: the runtime user can write under /app:"; echo "$writable"; exit 1; }
          done

      # BE-17 (M17): the web runtime image holds the build output, the translation files and the
      # Express server only. Routes, components, tests, stories and build config stay out.
      - name: 📦 Web image holds built output only
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          extra=$(docker run --rm --entrypoint sh flump-web-ci -c '
            cd /app/apps/web
            ls -A | grep -vxE "app|build|node_modules|package\.json|public|server|server\.ts" || true
            ls -A app | grep -vx security || true
            ls -A public | grep -vx locales || true
            find app server -type f ! -name "*.ts" || true
            find app server -type f \( -name "*.test.ts" -o -name "*.stories.*" \) || true')
          [ -z "$extra" ] || { echo "web image carries files beyond its runtime set:"; echo "$extra"; exit 1; }
          docker run --rm --entrypoint sh flump-web-ci -c 'test -f /app/apps/web/build/server/index.js && test -d /app/apps/web/build/client'

      - name: ⚙️ Setup Bun (for SBOM generation)
        if: steps.changed.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: 📜 Generate per-image CycloneDX SBOMs
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          mkdir -p sboms
          for app in backend web marketing; do
            docker run --rm --entrypoint bun "flump-$app-ci" -e '
              import { existsSync, readdirSync, readFileSync } from "node:fs";
              import { join } from "node:path";
              const out = [];
              const seen = new Set();
              const walk = (nm) => {
                if (!existsSync(nm)) return;
                for (const e of readdirSync(nm, { withFileTypes: true })) {
                  if (!e.isDirectory() && !e.isSymbolicLink()) continue;
                  const p = join(nm, e.name);
                  if (seen.has(p)) continue;
                  seen.add(p);
                  if (e.name === ".bun") {
                    for (const b of readdirSync(p, { withFileTypes: true })) if (b.isDirectory()) walk(join(p, b.name, "node_modules"));
                    continue;
                  }
                  if (e.name.startsWith("@")) {
                    for (const s of readdirSync(p, { withFileTypes: true })) {
                      if (!s.isDirectory() && !s.isSymbolicLink()) continue;
                      const d = join(p, s.name);
                      try { const j = JSON.parse(readFileSync(join(d, "package.json"), "utf8")); if (j.name && j.version) out.push({ name: j.name, version: j.version, ...(typeof j.license === "string" ? { license: j.license } : {}) }); } catch {}
                      walk(join(d, "node_modules"));
                    }
                    continue;
                  }
                  try { const j = JSON.parse(readFileSync(join(p, "package.json"), "utf8")); if (j.name && j.version) out.push({ name: j.name, version: j.version, ...(typeof j.license === "string" ? { license: j.license } : {}) }); } catch {}
                  walk(join(p, "node_modules"));
                }
              };
              walk("/app/node_modules");
              walk("/app/apps/'"$app"'/node_modules");
              console.log(JSON.stringify(out));
            ' > "sboms/$app-packages.json"
            bun scripts/generate-sbom.ts --app "$app" --packages-json "sboms/$app-packages.json" --out "sboms/sbom-$app.cdx.json"
            rm -f "sboms/$app-packages.json"
          done

      - name: 📎 Upload image CycloneDX SBOMs
        if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sboms/sbom-*.cdx.json
          retention-days: 30

      # The Sentry token is a build ARG in the web build stage. The runner stage starts from the
      # base image and copies files out, so the value must not be in the final image: not in its
      # layer history or config, and not in any file.
      - name: 🔑 Build token is not in the web image
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          if docker history --no-trunc --format '{{.CreatedBy}}' flump-web-ci | grep -qE "$TOKEN_CANARY|SENTRY_AUTH_TOKEN"; then
            echo "the web image history names the build token"; exit 1
          fi
          if docker inspect flump-web-ci | grep -q "$TOKEN_CANARY"; then
            echo "the web image config carries the build token"; exit 1
          fi
          hits=$(docker run --rm --user 0 --entrypoint sh -e "CANARY=$TOKEN_CANARY" flump-web-ci -c 'grep -rlF "$CANARY" /app /home /root /tmp /usr/local 2>/dev/null | head -n 5 || true')
          [ -z "$hits" ] || { echo "the build token is in the web image's files:"; echo "$hits"; exit 1; }
          # The plugin ran (it must have tried the upload), and it left no source map behind.
          grep -q "sentry-vite-plugin\|\[sentry\]" docker-web.log || { echo "the Sentry plugin did not run in the canary build"; exit 1; }
          maps=$(docker run --rm --entrypoint sh flump-web-ci -c 'find /app/apps/web/build -name "*.map" | head -n 5')
          [ -z "$maps" ] || { echo "source maps are in the web image:"; echo "$maps"; exit 1; }
          echo "token canary absent from history, config and files; no source maps"

      # Boots the production image with NODE_ENV=production. Strict config resolution plus
      # migrationsRun mean the server only listens once the config is valid and every
      # migration has applied; /health/ready then proves the database answers.
      - name: 🚀 Backend container boot smoke
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          trap 'docker logs flump-backend-smoke 2>&1 | tail -n 60; docker rm -f flump-backend-smoke >/dev/null 2>&1 || true' EXIT
          key=$(openssl rand -hex 32)
          docker run -d --name flump-backend-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL=postgres://flump_ci:flump-ci-not-a-secret@127.0.0.1:5432/flump_ci \
            -e DB_SSL=false \
            -e BANKING_TOKEN_ENCRYPTION_KEY="$key" \
            -e RECEIPT_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e WORKOS_CLIENT_ID=client_ci_dummy \
            -e CORS_ALLOWED_ORIGINS=https://example.invalid \
            -e MCP_AUDIT_HMAC_KEY="$(openssl rand -hex 32)" \
            -e DELETION_TOMBSTONE_KEY="$(openssl rand -hex 32)" \
            -e WEB_CLIENT_IP_HMAC_KEY="$(openssl rand -hex 32)" \
            -e WORKOS_API_KEY="sk_ci_$(openssl rand -hex 8)" \
            -e BETA_OPEN=true \
            flump-backend-ci
          # BE-07 launch gate: the bank flag must refuse boot until BE-12 flips the gate. Bounded by
          # `timeout 60`: a boot that hangs instead of refusing fails the step (exit 124).
          set +e
          timeout 60 docker run --rm --name flump-bank-gate --network host -e NODE_ENV=production -e PORT=4001 \
            -e DATABASE_URL=postgres://flump_ci:flump-ci-not-a-secret@127.0.0.1:5432/flump_ci \
            -e DB_SSL=false -e BANKING_TOKEN_ENCRYPTION_KEY="$key" -e RECEIPT_ENCRYPTION_KEY="$key" \
            -e WORKOS_CLIENT_ID=client_ci_dummy -e CORS_ALLOWED_ORIGINS=https://example.invalid \
            -e MCP_AUDIT_HMAC_KEY="$key" -e DELETION_TOMBSTONE_KEY="$key" -e WEB_CLIENT_IP_HMAC_KEY="$key" \
            -e WORKOS_API_KEY="sk_ci_$(openssl rand -hex 8)" -e BETA_OPEN=true -e BANK_CONNECTIONS_ENABLED=true \
            flump-backend-ci > bank-gate.log 2>&1
          gate_status=$?
          set -e
          docker rm -f flump-bank-gate >/dev/null 2>&1 || true
          if [ "$gate_status" -eq 124 ]; then
            echo "bank-gate boot neither refused nor exited within 60s"; tail -n 20 bank-gate.log; exit 1
          fi
          if [ "$gate_status" -eq 0 ]; then
            echo "backend booted with BANK_CONNECTIONS_ENABLED=true"; exit 1
          fi
          grep -q BankLaunchGateError bank-gate.log || { echo "bank flag did not fail with BankLaunchGateError"; tail -n 20 bank-gate.log; exit 1; }
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/health/ready || true)
            [ "$code" = "200" ] && { echo "ready after ~$((i * 2))s"; exit 0; }
            [ "$(docker inspect -f '{{.State.Running}}' flump-backend-smoke)" = "true" ] || { echo "backend container exited"; exit 1; }
            sleep 2
          done
          echo "backend did not become ready within 60s"
          exit 1

      # BE-15 (N8): the retention cron's real command (apps/backend/retention.railway.json) inside
      # the built image, against this job's throwaway database, which the boot smoke above has just
      # migrated. The command has no dry-run mode; every table here is empty, so it deletes nothing
      # and proves the entry point loads, connects and exits 0. No heartbeat URL is set.
      - name: 🧹 Backend retention command smoke
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          timeout 120 docker run --rm --name flump-retention-smoke --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://flump_ci:flump-ci-not-a-secret@127.0.0.1:5432/flump_ci \
            -e DB_SSL=false \
            flump-backend-ci bun dist/jobs/retention-purge.js > retention.log 2>&1 \
            || { status=$?; echo "retention command exited $status"; tail -n 40 retention.log; exit 1; }
          cat retention.log
          grep -q "retention inactive_accounts_due=" retention.log \
            || { echo "retention command did not finish its run"; exit 1; }

      # Boots the web production image (`bun server.ts`, the custom Express server) with dummy
      # WorkOS settings and NODE_ENV=production, which also proves the server runs under the
      # image's pinned Bun. /healthz needs no backend. One security header must be present on
      # the response and X-Powered-By must be absent.
      - name: 🚀 Web container boot smoke
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          trap 'docker logs flump-web-smoke 2>&1 | tail -n 60; docker rm -f flump-web-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name flump-web-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3100 \
            -e WORKOS_API_KEY="sk_ci_$(openssl rand -hex 8)" \
            -e WORKOS_CLIENT_ID=client_ci_dummy \
            -e WORKOS_COOKIE_PASSWORD="$(openssl rand -hex 32)" \
            -e WORKOS_REDIRECT_URI=https://web.example.invalid/callback \
            -e VITE_API_URL=https://api.example.invalid \
            -e WEB_CLIENT_IP_HMAC_KEY="$(openssl rand -hex 32)" \
            flump-web-ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/healthz || true)
            if [ "$code" = "200" ]; then
              echo "ready after ~$((i * 2))s"
              headers=$(curl -s -D - -o /dev/null http://127.0.0.1:3100/healthz)
              echo "$headers" | grep -qi '^x-frame-options: DENY' || { echo "missing X-Frame-Options"; echo "$headers"; exit 1; }
              echo "$headers" | grep -qi '^content-security-policy: frame-ancestors' || { echo "missing CSP"; echo "$headers"; exit 1; }
              if echo "$headers" | grep -qi '^x-powered-by'; then echo "X-Powered-By is set"; exit 1; fi
              # A server-rendered document (the 404 page) proves the slim image has everything a
              # render needs, including the translation files read from ./public/locales.
              page=$(curl -s -o render-probe.html -w '%{http_code}' http://127.0.0.1:3100/ci-render-probe)
              [ "$page" = "404" ] || { echo "render probe answered $page, expected the 404 page"; exit 1; }
              grep -q '<html' render-probe.html || { echo "render probe did not return a document"; exit 1; }
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/locales/en/common.json)
              [ "$code" = "200" ] || { echo "translations are missing from the image ($code)"; exit 1; }
              if docker logs flump-web-smoke 2>&1 | grep -qE 'ENOENT|EACCES'; then echo "web server logged a missing or unreadable file"; exit 1; fi
              exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' flump-web-smoke)" = "true" ] || { echo "web container exited"; exit 1; }
            sleep 2
          done
          echo "web did not become ready within 60s"
          exit 1

  audit:
    name: 🛡️ Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup

      # Policy: exit 1 (real high/critical advisory with no allow-list entry) fails the job on
      # every event (PRs, push to main, and weekly schedule) so known high/critical advisories
      # never fail open.
      # Exit 2 (registry outage / unreadable report, after one retry in the script) is a
      # warning on every event: an outage is not the PR's fault and must not turn main red.
      - name: 🛡️ Audit dependencies (high and critical block)
        run: |
          set +e
          bun run check:audit 2>&1 | tee audit-output.txt
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0)
              echo "### 🛡️ Dependency audit: clean" >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              {
                echo "### 🛡️ Dependency audit: high or critical advisories found"
                echo ""
                echo '```'
                cat audit-output.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Dependency audit::High or critical advisories found (see job summary). Fix, upgrade, or add a time-boxed audit-allowlist.json entry."
              exit 1
              ;;
            2)
              {
                echo "### 🛡️ Dependency audit: could not complete (exit $code)"
                echo ""
                echo '```'
                cat audit-output.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Dependency audit unavailable::bun audit could not produce a usable report after one retry (exit $code). Not failing the job; re-run or check the registry."
              ;;
            *)
              {
                echo "### 🛡️ Dependency audit: configuration error (exit $code)"
                echo ""
                echo '```'
                cat audit-output.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Dependency audit configuration::Allow-list or report shape is invalid (exit $code). This is a repo bug, not an outage: fix audit-allowlist.json or scripts/lib/audit.ts."
              exit 1
              ;;
          esac
