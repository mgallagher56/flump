name: 🔐 Security Scan

# Advisory scanners, one job per tool so more can be appended (E20-N27: ZAP,
# Semgrep). None of these are required checks; a red run is a prompt to triage.
# Scheduled runs are skipped here: gitleaks scans a commit range, and the
# full-history scan is a manual local command (docs/runbooks/secret-scan.md).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; each job redeclares what it needs.
permissions:
  contents: read

jobs:
  secret-scan:
    name: 🔑 Secret scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔑 Scan commit range with gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # gitleaks v8.30.1 (multi-arch index digest), same tag on Docker Hub and GHCR.
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="" # new branch or first push: scan all history
          else
            RANGE="${BEFORE}..${HEAD_SHA}"
          fi
          echo "gitleaks range: ${RANGE:-<all history>}"
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --config /repo/.gitleaks.toml \
            ${RANGE:+--log-opts="$RANGE"} \
            --redact --exit-code 1
