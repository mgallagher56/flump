name: 🧬 Mutation testing

# E41 M1, M3 and M4 (docs/audit/plans/E41-mutation-testing-and-test-speed-plan.md, decisions 3 to 6).
# Stryker makes one small fault at a time in a package's source and runs its tests; a fault no
# test fails on has "survived". See docs/testing/mutation-testing.md.
#
# - Full run: weekly per package at night, staggered by cron, plus a manual start. It fails its
#   own job when the score is under the package's floor in scripts/mutation-baseline.json. It is
#   not a merge gate and is not listed in .github/required-checks.json.
# - Changed files: on pull requests that touch a covered package. Advisory (decision 4): it lists
#   faults no test caught in the changed files and never blocks a merge.
#
# Reports are HTML and JSON artifacts only, no hosted dashboard (decision 6). No secrets.
on:
  schedule:
    # One cron per package, 02:17 UTC on its own night (packages that share a night start later).
    # A new package gets its own cron, an entry in the "Pick packages" step below, its folder in
    # PACKAGES in the "Changed files" job, its paths below and a floor in
    # scripts/mutation-baseline.json.
    - cron: "17 2 * * 0" # Sunday: packages/finance-engine
    - cron: "17 2 * * 1" # Monday: packages/mcp
    - cron: "17 2 * * 2" # Tuesday: packages/api-contract
    - cron: "17 2 * * 3" # Wednesday: packages/banking
    - cron: "17 2 * * 4" # Thursday: packages/observability
    - cron: "17 2 * * 5" # Friday: packages/format
    - cron: "17 2 * * 6" # Saturday: packages/api-client
    - cron: "47 3 * * 0" # Sunday, after the engine: packages/business-details
    - cron: "47 3 * * 3" # Wednesday, after banking: apps/backend
  workflow_dispatch:
    inputs:
      package:
        description: "Package to mutation-test (a folder such as packages/finance-engine or apps/backend), or all"
        type: string
        default: packages/finance-engine
      force:
        description: "Ignore the saved incremental results and rerun every fault (the weekly run always does)"
        type: boolean
        default: false
  pull_request:
    branches:
      - main
    paths:
      - "packages/finance-engine/src/**"
      - "packages/finance-engine/stryker.config.json"
      - "packages/finance-engine/vitest.config.ts"
      - "packages/mcp/src/**"
      - "packages/mcp/stryker.config.json"
      - "packages/mcp/vitest.config.ts"
      - "packages/api-contract/src/**"
      - "packages/api-contract/stryker.config.json"
      - "packages/api-contract/vitest.config.ts"
      - "packages/banking/src/**"
      - "packages/banking/stryker.config.json"
      - "packages/banking/vitest.config.ts"
      - "packages/observability/src/**"
      - "packages/observability/stryker.config.json"
      - "packages/observability/vitest.config.ts"
      - "packages/format/src/**"
      - "packages/format/stryker.config.json"
      - "packages/format/vitest.config.ts"
      - "packages/api-client/src/**"
      - "packages/api-client/stryker.config.json"
      - "packages/api-client/vitest.config.ts"
      - "packages/business-details/src/**"
      - "packages/business-details/stryker.config.json"
      - "packages/business-details/vitest.config.ts"
      - "apps/backend/src/**"
      - "apps/backend/stryker.config.json"
      - "apps/backend/vitest.config.ts"
      - "apps/backend/vitest.stryker.config.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: 🧬 Mutation testing (pick packages)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      # Each target is a package folder, a short name for artifact and cache keys, and how many
      # shards its files are split into. Shard counts come from each package's measured full run
      # (docs/testing/mutation-testing.md): a small package runs in one shard.
      - name: 🗂️ Pick packages
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.package }}
        run: |
          engine='{"package":"packages/finance-engine","slug":"finance-engine","shards":8}'
          mcp='{"package":"packages/mcp","slug":"mcp","shards":4}'
          contract='{"package":"packages/api-contract","slug":"api-contract","shards":1}'
          banking='{"package":"packages/banking","slug":"banking","shards":1}'
          observability='{"package":"packages/observability","slug":"observability","shards":1}'
          format='{"package":"packages/format","slug":"format","shards":1}'
          client='{"package":"packages/api-client","slug":"api-client","shards":1}'
          business='{"package":"packages/business-details","slug":"business-details","shards":1}'
          backend='{"package":"apps/backend","slug":"backend","shards":4}'
          all="[$engine,$mcp,$contract,$banking,$observability,$format,$client,$business,$backend]"
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              "17 2 * * 0") targets="[$engine]" ;;
              "17 2 * * 1") targets="[$mcp]" ;;
              "17 2 * * 2") targets="[$contract]" ;;
              "17 2 * * 3") targets="[$banking]" ;;
              "17 2 * * 4") targets="[$observability]" ;;
              "17 2 * * 5") targets="[$format]" ;;
              "17 2 * * 6") targets="[$client]" ;;
              "47 3 * * 0") targets="[$business]" ;;
              "47 3 * * 3") targets="[$backend]" ;;
              *) echo "::error::No package is set for the schedule '$SCHEDULE'"; exit 1 ;;
            esac
          else
            case "$INPUT" in
              all) targets="$all" ;;
              packages/finance-engine) targets="[$engine]" ;;
              packages/mcp) targets="[$mcp]" ;;
              packages/api-contract) targets="[$contract]" ;;
              packages/banking) targets="[$banking]" ;;
              packages/observability) targets="[$observability]" ;;
              packages/format) targets="[$format]" ;;
              packages/api-client) targets="[$client]" ;;
              packages/business-details) targets="[$business]" ;;
              apps/backend) targets="[$backend]" ;;
              *) echo "::error::'$INPUT' has no mutation config. Use all or a package folder from: $all"; exit 1 ;;
            esac
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          # One matrix entry per shard of each package: the target plus its shard number.
          echo "shards=$(jq -c '[.[] as $t | range(1; $t.shards + 1) | {target: $t, shard: .}]' <<<"$targets")" >> "$GITHUB_OUTPUT"

  # Each package is split into shards of similar size that run side by side, as many as its target
  # sets in the "Pick packages" step. The engine's first run took 4 to 18 minutes per shard, 19
  # minutes in all (docs/testing/mutation-testing.md); the timeout leaves room for a slower runner.
  full:
    name: 🧬 Mutation testing (${{ matrix.target.slug }}, shard ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      PACKAGE: ${{ matrix.target.package }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.target.shards }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stryker 10 needs Node 22 or later. Pinned so a runner image change cannot move it.
      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup

      # Workspace packages resolve each other through their built dist (api-client and mcp import
      # @flump/api-contract, mcp also the engine and api-client). Built before Stryker writes
      # faults into the source files, and never the package under test itself.
      - name: 🏗️ Build the package's dependencies
        run: bunx turbo run build --filter="{./$PACKAGE}^..."

      # Picked before Stryker runs: the run writes faults into the source files (inPlace).
      - name: 🗂️ Files in this shard
        id: shard
        shell: bash # -eo pipefail
        run: |
          files=$(bun scripts/check-mutation-score.ts shard "$PACKAGE" "$SHARD" "$SHARDS")
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Shard $SHARD of $SHARDS: $(tr ',' '\n' <<<"$files" | grep -c .) files"

      # The incremental file lets a manual start reuse a fault's result when neither its file nor
      # the test files changed. It does not see changes to other source files a test imports, so
      # the weekly run always reruns every fault (--force) and saves fresh results for later
      # manual starts. Each run saves a new entry; the newest one is restored.
      - name: 🗃️ Restore incremental results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.target.package }}/reports/mutation/stryker-incremental.json
          key: mutation-incremental-${{ matrix.target.slug }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: mutation-incremental-${{ matrix.target.slug }}-shard${{ matrix.shard }}-

      - name: 🧬 Run Stryker
        if: steps.shard.outputs.files != ''
        working-directory: ${{ matrix.target.package }}
        env:
          FILES: ${{ steps.shard.outputs.files }}
          FORCE: ${{ (github.event_name == 'schedule' || inputs.force) && '--force' || '' }}
        run: |
          node --version
          # shellcheck disable=SC2086 # FORCE is empty or one flag
          node ../../node_modules/@stryker-mutator/core/bin/stryker.js run $FORCE \
            --mutate "$FILES" --concurrency 4 \
            --reporters clear-text,html,json,progress-append-only

      - name: 🗃️ Save incremental results
        if: always() && hashFiles(format('{0}/reports/mutation/stryker-incremental.json', matrix.target.package)) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.target.package }}/reports/mutation/stryker-incremental.json
          key: mutation-incremental-${{ matrix.target.slug }}-shard${{ matrix.shard }}-${{ github.run_id }}

      - name: 📎 Upload shard report
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-report-${{ matrix.target.slug }}-shard${{ matrix.shard }}
          path: |
            ${{ matrix.target.package }}/reports/mutation/mutation.html
            ${{ matrix.target.package }}/reports/mutation/mutation.json
          retention-days: 30
          if-no-files-found: error

  # The ratchet (decision 3): cuts each shard report to that shard's files (a report can carry a
  # file over from an earlier run), joins them and compares the score with the floor.
  score:
    name: 🧬 Mutation testing (${{ matrix.target.slug }}, score)
    needs: [plan, full]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      PACKAGE: ${{ matrix.target.package }}
      SLUG: ${{ matrix.target.slug }}
      SHARDS: ${{ matrix.target.shards }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup

      - name: 📥 Download shard reports
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mutation-report-${{ matrix.target.slug }}-shard*
          path: shard-reports

      # Fails when a shard report is missing, so a shard that broke cannot pass as a high score.
      - name: 📏 Check the score against the floor
        shell: bash # -eo pipefail, so the check's exit code is kept through tee
        run: |
          reports=()
          for i in $(seq 1 "$SHARDS"); do
            report="shard-reports/mutation-report-$SLUG-shard$i/mutation.json"
            # A pattern that matches one artifact only is unpacked straight into the path, with no
            # folder named after the artifact (seen on the first single-shard runs).
            if [ "$SHARDS" = 1 ] && [ ! -f "$report" ]; then report="shard-reports/mutation.json"; fi
            [ -f "$report" ] || { echo "::error::No report from shard $i"; exit 1; }
            reports+=("$report")
          done
          bun scripts/check-mutation-score.ts check "$PACKAGE" "${reports[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  changed:
    name: 🧬 Mutation testing (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Advisory (decision 4): after four weeks of results the owner decides whether it blocks for
    # packages/finance-engine. Until then it never fails the workflow.
    continue-on-error: true
    env:
      # Every package with a stryker.config.json. Keep in step with "Pick packages" and the paths.
      PACKAGES: >-
        packages/finance-engine packages/mcp packages/api-contract packages/banking
        packages/observability packages/format packages/api-client packages/business-details
        apps/backend
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: ⚙️ Setup Bun and install dependencies
        uses: ./.github/actions/bun-setup

      # One line per package with changed source files: the folder, a space, then the files.
      - name: 🗂️ Changed source files
        id: targets
        shell: bash # -eo pipefail, so a failing git diff or script stops the job
        run: |
          # HEAD is GitHub's merge commit; its first parent is main as it was at that merge, so
          # changes that reached main after the pull request opened are not counted as its own.
          changed=$(git diff --name-only HEAD^1 HEAD)
          : > "$RUNNER_TEMP/mutation-targets.txt"
          for package in $PACKAGES; do
            targets=$(bun scripts/check-mutation-score.ts targets "$package" <<<"$changed")
            if [ -n "$targets" ]; then echo "$package $targets" >> "$RUNNER_TEMP/mutation-targets.txt"; fi
          done
          if [ -s "$RUNNER_TEMP/mutation-targets.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed source file to mutate in $PACKAGES (tests, fixtures and barrels are left out)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # As in the weekly shards: dependencies are built from unmutated source before any run.
      # Every command inside a `while read` loop takes its stdin from /dev/null, so none of them can
      # swallow the rest of the target list.
      - name: 🏗️ Build the packages' dependencies
        if: steps.targets.outputs.any == 'true'
        shell: bash # -eo pipefail
        run: |
          while read -r package _; do
            bunx turbo run build --filter="{./$package}^..." < /dev/null
          done < "$RUNNER_TEMP/mutation-targets.txt"

      # No incremental cache here: each weekly shard's file covers only its own files, and test ids
      # are numbered per run, so shard files cannot be joined. Only the changed files are mutated.
      - name: 🧬 Run Stryker on the changed files
        if: steps.targets.outputs.any == 'true'
        shell: bash # -eo pipefail
        run: |
          node --version
          while read -r package targets; do
            (cd "$package" && node "$GITHUB_WORKSPACE/node_modules/@stryker-mutator/core/bin/stryker.js" run \
              --mutate "$targets" --reporters clear-text,html,json,progress-append-only < /dev/null)
          done < "$RUNNER_TEMP/mutation-targets.txt"

      - name: 📋 List the faults no test caught
        if: steps.targets.outputs.any == 'true'
        shell: bash # -eo pipefail
        run: |
          while read -r package _; do
            bun scripts/check-mutation-score.ts survivors "$package" < /dev/null >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/mutation-targets.txt"

      - name: 📎 Upload report
        if: always() && steps.targets.outputs.any == 'true'
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-report-changed
          path: |
            packages/*/reports/mutation/mutation.html
            packages/*/reports/mutation/mutation.json
            apps/backend/reports/mutation/mutation.html
            apps/backend/reports/mutation/mutation.json
          retention-days: 14
          if-no-files-found: warn
