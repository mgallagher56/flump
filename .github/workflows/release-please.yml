name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: 📦 Release
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          target-branch: main
          # A fine-grained PAT (contents + pull requests: read and write) so the release PR
          # it opens triggers the CI workflow. PRs opened with the default GITHUB_TOKEN do not.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: "[Debug] release-please outputs"
        env:
          RELEASE_PLEASE_CONTEXT: ${{ toJson(steps.release.outputs) }}
        run: echo "$RELEASE_PLEASE_CONTEXT"
