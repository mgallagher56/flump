version: 1

# Non-UI routes (API proxies, file downloads, health/security endpoints).
# Every entry must match a real route file and state a reason.
excluded_routes:
  - route_file: apps/mobile/app/(dev)/engine-check.tsx
    reason: Development-only device check (tax vectors and formatter fixture on the phone's JavaScript engine); production builds strip it and the route only redirects home.
  - route_file: apps/mobile/app/(dev)/sign-in-check.tsx
    reason: Development-only sign-in check (E12 S2a) that answers the WorkOS questions after a real sign-in, showing no token values; production builds strip it and the route only redirects home.
  - route_file: apps/mobile/app/auth/callback.tsx
    reason: The sign-in redirect flump://auth/callback. The browser sheet hands it to the waiting sign-in; Android also opens the app there (ignored by app/+native-intent.ts while the app is open), and on a cold start this route only redirects to the first screen.
  - route_file: apps/mobile/app/+native-intent.ts
    reason: Not a page. Expo Router's hook for links the system opens the app with; it ignores Android's copy of the sign-in redirect while the app is open (E12 S4).
  - route_file: apps/mobile/app/(dev)/gallery.tsx
    reason: Development-only component gallery (every component in light, dark and 200% text); production builds strip it and the route only redirects home.
  - route_file: apps/web/app/routes/$feature._index.tsx
    reason: Legacy feature redirect route sending known slugs to /app/* and throwing 404 for unknown top-level paths.
  - route_file: apps/web/app/routes/account.export.ts
    reason: Resource route streaming the signed-in user's JSON data export triggered from Settings.
  - route_file: apps/web/app/routes/api.$.tsx
    reason: Backend API proxy resource route for /api/*; no user-facing page.
  - route_file: apps/web/app/routes/app._index.tsx
    reason: Pure redirect route sending signed-in users to / (or /app/onboarding if incomplete, or /login / /sandbox if signed out).
  - route_file: apps/web/app/routes/app.forecast.tsx
    reason: Pure 301 redirect route sending old /app/forecast links to /app/savings#forecast.
  - route_file: apps/web/app/routes/app.onboarding.mortgage-with-property.ts
    reason: Onboarding resource action endpoint creating a linked mortgage and property.
  - route_file: apps/web/app/routes/app.sandbox.tsx
    reason: Pure redirect route sending /app/sandbox to /sandbox.
  - route_file: apps/web/app/routes/app.tax._index.tsx
    reason: Pure 301 redirect route sending old /app/tax links to /app/self-assessment.
  - route_file: apps/web/app/routes/app.tax.receipts.$id.tsx
    reason: Resource route streaming one tax receipt file through the signed-in session; no UI.
  - route_file: apps/web/app/routes/callback.tsx
    reason: OAuth callback handler completing WorkOS sign-in and setting session cookies.
  - route_file: apps/web/app/routes/csp-report.ts
    reason: Resource route receiving CSP violation reports; no UI.
  - route_file: apps/web/app/routes/healthz.ts
    reason: Deployment health check resource route returning JSON status; no UI.
  - route_file: apps/web/app/routes/household.join.$token.tsx
    reason: Pure redirect route storing a household invitation token in an HttpOnly cookie and redirecting to /household/join (E34 C3, behind the household switch).
  - route_file: apps/web/app/routes/invite.$token.tsx
    reason: Pure redirect route storing the invite token in an HttpOnly cookie and redirecting to /invite.
  - route_file: apps/web/app/routes/login._index.tsx
    reason: Pure redirect route sending the browser to WorkOS sign-in (or setting the dev session cookie in tests).
  - route_file: apps/web/app/routes/logout._index.tsx
    reason: POST-only sign-out handler clearing session cookies and redirecting (GET redirects to /).
  - route_file: apps/web/app/routes/ping.tsx
    reason: Health/ping endpoint returning HTTP 200 with Cache-Control no-store on GET.
  - route_file: apps/web/app/routes/robots[.]txt.ts
    reason: Resource route serving plain-text /robots.txt; no UI.
  - route_file: apps/web/app/routes/sandbox.tsx
    reason: Pure redirect route sending /sandbox to /signup.
  - route_file: apps/web/app/routes/signup._index.tsx
    reason: Pure redirect route sending the browser to WorkOS sign-up (or /login when invite-only).
