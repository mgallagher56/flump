id: mobile-account-edit
app: mobile
route: /accounts/:id/edit
title: Edit an account
auth: required
purpose: Edit or delete an account (E12 S8), also opened by flump://accounts/<id>/edit, with the same fields as adding. An edit sends only what changed, with If-Match for the version read. Delete sits inside edit, as on web, and asks first with the platform alert.
route_file: apps/mobile/app/(app)/accounts/[id]/edit.tsx

sections:
  - id: edit-account-form
    component: apps/mobile/src/screens/AccountForm/AccountForm.tsx
    facts_read:
      - account-name
      - account-type
      - account-balance
      - account-rate
      - account-monthly-amount
      - ownership-share
      - repayment-type
      - mortgage-term-and-fix-end
      - mortgage-property-link
      - card-limit-and-zero-percent-end
