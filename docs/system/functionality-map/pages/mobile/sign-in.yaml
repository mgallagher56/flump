id: sign-in
app: mobile
route: /
title: Flump
auth: public
purpose: First screen of the Expo app (E12 S2a). Signed out, it shows the name, the tagline, Sign in and Create account (WorkOS AuthKit in the system browser sheet, PKCE) and the privacy and terms links. After sign-in it checks the account with GET /v1/user-profile and shows the Home tab inside the tab bar (E12 S4) with the monthly check-in row when one is due (E12 S3); restored without reaching Flump, Home shows the offline screen while the tabs stay, Not invited, the terms screen (403 terms_not_accepted sends the person to the website to agree)or the session-ended screen.
route_file: apps/mobile/app/(app)/(tabs)/index.tsx

sections:
  - id: gate
    component: apps/mobile/src/screens/SessionGate/SessionGate.tsx
  - id: sign-in
    component: apps/mobile/src/screens/SignIn/SignIn.tsx
  - id: signed-in
    component: apps/mobile/src/screens/Home/Home.tsx
  - id: check-in-row
    component: apps/mobile/src/screens/Home/Home.tsx
    facts_read:
      - balance-history
      - check-in-done
      - check-in-day
  - id: not-invited
    component: apps/mobile/src/screens/NotInvited/NotInvited.tsx
  - id: terms-required
    component: apps/mobile/src/screens/TermsRequired/TermsRequired.tsx
  - id: session-ended
    component: apps/mobile/src/screens/SessionEnded/SessionEnded.tsx
  - id: offline
    component: apps/mobile/src/screens/Offline/Offline.tsx
  - id: sign-in-unavailable
    component: apps/mobile/src/screens/SignInUnavailable/SignInUnavailable.tsx
