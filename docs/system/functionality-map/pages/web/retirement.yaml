id: retirement
app: web
route: /app/retirement
title: Retirement plan
auth: required
purpose: See an estimate of yearly retirement income from saved pots and State Pension, test what-if changes, and save retirement plan details.
route_file: apps/web/app/routes/app.retirement.tsx

sections:
  - id: header
    component: apps/web/app/features/retirement/components/RetirementPlanner/RetirementPlanner.tsx

  - id: hero
    component: apps/web/app/features/retirement/components/RetirementPlanner/RetirementPlanner.tsx
    facts_read:
      - retirement-plan
      - account-balance
      - salary
      - pension-rates
      - birth-year
      - housing-cost
      - housing-status
      - budget-entries
      - mortgage-term-and-fix-end
    figures_shown:
      - retirement-income

  - id: kpis
    component: apps/web/app/features/retirement/components/RetirementPlanner/RetirementPlanner.tsx
    facts_read:
      - retirement-plan
      - account-balance
    figures_shown:
      - retirement-income

  - id: what-if-zone
    component: apps/web/app/features/retirement/components/RetirementPlanner/RetirementPlanner.tsx
    facts_read:
      - retirement-plan
      - salary
      - pension-rates
      - account-balance
      - balance-history
    figures_shown:
      - retirement-income

  - id: workplace-salary-notice
    component: apps/web/app/features/retirement/components/WorkplaceSalaryNotSet/WorkplaceSalaryNotSet.tsx
    facts_read:
      - salary
      - pension-rates

  - id: moneyhelper-guidance
    component: packages/ui/src/patterns/MoneyHelperGuidance/MoneyHelperGuidance.tsx

  - id: plan-details
    component: apps/web/app/features/retirement/components/RetirementPlanner/RetirementPlanner.tsx
    facts_read:
      - retirement-plan
      - budget-entries
      - account-balance
