id: import-review
app: web
route: /app/imports/:id
title: Review import
auth: required
purpose: Map imported accounts to Flump accounts, review balance diffs, save staged balances, or undo a saved import.
route_file: apps/web/app/routes/app.imports.$id.tsx

sections:
  - id: header
    component: apps/web/app/features/imports/components/ImportReviewPage/ImportReviewPage.tsx

  - id: summary-kpis
    component: apps/web/app/features/imports/components/ImportReviewPage/ImportReviewPage.tsx

  - id: account-mapping
    component: apps/web/app/features/imports/components/AccountMappingPanel/AccountMappingPanel.tsx

  - id: diff-table
    component: apps/web/app/features/imports/components/ImportDiffTable/ImportDiffTable.tsx
    facts_read:
      - account-balance
      - balance-history

  - id: commit-bar
    component: apps/web/app/features/imports/components/ImportReviewPage/ImportReviewPage.tsx

  - id: post-commit-actions
    component: apps/web/app/features/imports/components/ImportReviewPage/ImportReviewPage.tsx
