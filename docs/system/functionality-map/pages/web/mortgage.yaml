id: mortgage
app: web
route: /app/mortgage
title: Your mortgage
auth: required
purpose: View saved residential or buy-to-let mortgage details, loan-to-value, home equity, fix-end alerts, and model overpayments, rate changes, or overpaying versus saving.
route_file: apps/web/app/routes/app.mortgage.tsx

sections:
  - id: header
    component: apps/web/app/containers/mortgage/MortgageContainer.tsx

  - id: empty-or-partial-state
    component: apps/web/app/containers/mortgage/MortgageContainer.tsx
    facts_read:
      - account-balance
      - account-rate
      - mortgage-term-and-fix-end
      - housing-status

  - id: hero-and-kpis
    component: apps/web/app/containers/mortgage/MortgageContainer.tsx
    facts_read:
      - account-balance
      - account-monthly-amount
      - account-rate
      - mortgage-term-and-fix-end
      - home-value
      - ownership-share
      - repayment-type
      - mortgage-property-link
    figures_shown:
      - mortgage-payment
      - loan-to-value

  - id: alerts
    component: apps/web/app/features/mortgage/components/MortgageAlerts/MortgageAlerts.tsx
    facts_read:
      - mortgage-term-and-fix-end

  - id: btl-overview
    component: apps/web/app/features/mortgage/components/BtlOverview/BtlOverview.tsx
    facts_read:
      - buy-to-let-rent
      - buy-to-let-mortgage
      - home-value
      - tax-records

  - id: details-summary
    component: apps/web/app/features/mortgage/components/MortgageSummary/MortgageSummary.tsx
    facts_read:
      - account-name
      - repayment-type
      - mortgage-term-and-fix-end
      - home-value
      - account-balance
      - ownership-share
    figures_shown:
      - home-equity

  - id: scenario-zone
    component: apps/web/app/containers/mortgage/MortgageContainer.tsx
    facts_read:
      - account-balance
      - account-rate
      - mortgage-term-and-fix-end
      - repayment-type
    figures_shown:
      - mortgage-payment
      - mortgage-rate-comparison

  - id: cost-details-drawer
    component: apps/web/app/features/mortgage/components/MortgageTracker/MortgageTracker.tsx
    facts_read:
      - account-balance
      - account-rate
      - mortgage-term-and-fix-end
      - repayment-type

  - id: edit-dialog
    component: apps/web/app/features/mortgage/components/MortgageEditDialog/MortgageEditDialog.tsx
    facts_read:
      - account-balance
      - account-rate
      - account-monthly-amount
      - mortgage-term-and-fix-end
      - repayment-type
      - home-value
