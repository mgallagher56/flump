id: self-assessment-source
app: web
route: /app/self-assessment/:source
title: Income source | Self Assessment
auth: required
purpose: Inspect and manage income, expenses, allowance comparisons, and receipts for a single Self Assessment income source (self-employed, rental, savings, or PAYE) in one tax year.
route_file: apps/web/app/routes/app.self-assessment_.$source.tsx

sections:
  - id: header
    component: apps/web/app/containers/tax/TaxSourceContainer.tsx

  - id: kpi-strip
    component: apps/web/app/containers/tax/TaxSourceContainer.tsx
    facts_read:
      - tax-records

  - id: allowance-comparison
    component: apps/web/app/features/tax/components/AllowanceComparison/AllowanceComparison.tsx
    facts_read:
      - tax-records
      - rental-share-for-tax
      - salary
    figures_shown:
      - estimated-tax

  - id: calculated-figures
    component: apps/web/app/features/tax/components/CalculatedFigures/CalculatedFigures.tsx
    facts_read:
      - account-balance
      - account-rate

  - id: records-section
    component: apps/web/app/containers/tax/TaxSourceContainer.tsx
    facts_read:
      - tax-records
