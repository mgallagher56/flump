id: self-assessment
app: web
route: /app/self-assessment
title: Self Assessment
auth: required
purpose: Track income and expenses outside PAYE across tax years, view estimated Self Assessment tax bill, and manage records and receipts.
route_file: apps/web/app/routes/app.self-assessment.tsx

sections:
  - id: opt-in-gate
    component: apps/web/app/containers/tax/TaxContainer.tsx

  - id: header
    component: apps/web/app/containers/tax/TaxContainer.tsx
    facts_read:
      - tax-records

  - id: tax-rates-banner
    component: apps/web/app/containers/tax/TaxContainer.tsx

  - id: headline-or-empty
    component: apps/web/app/features/tax/components/TaxHeadline/TaxHeadline.tsx
    facts_read:
      - tax-records
      - salary
      - tax-region
      - employment-type
      - rental-share-for-tax
      - student-loan-plan
    figures_shown:
      - estimated-tax
      - personal-allowance-allocation
      - finance-costs-carried-forward

  - id: calculation-drawer
    component: apps/web/app/features/tax/components/TaxReservePanel/TaxReservePanel.tsx
    facts_read:
      - tax-records
      - salary
      - rental-share-for-tax
    figures_shown:
      - estimated-tax
      - personal-allowance-allocation
      - finance-costs-carried-forward

  - id: sources-panel
    component: apps/web/app/features/tax/components/TaxSourcesPanel/TaxSourcesPanel.tsx
    facts_read:
      - tax-records
      - account-balance

  - id: mtd-notice
    component: apps/web/app/features/tax/components/MtdNotice/MtdNotice.tsx
    facts_read:
      - tax-records
      - employment-type
      - rental-share-for-tax
    figures_shown:
      - mtd-qualifying-income

  - id: calculated-figures
    component: apps/web/app/features/tax/components/CalculatedFigures/CalculatedFigures.tsx
    facts_read:
      - account-balance
      - account-rate

  - id: records-and-years-drawers
    component: apps/web/app/features/tax/components/TaxRecordsTable/TaxRecordsTable.tsx
    facts_read:
      - tax-records
