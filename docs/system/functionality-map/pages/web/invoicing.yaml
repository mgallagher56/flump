id: invoicing
app: web
route: /app/invoicing
title: Work log and invoicing
auth: required
purpose: Log billable self-employed hours, build and issue numbered invoices, record payments, export CSVs, print invoices, and sync paid totals to Self Assessment.
route_file: apps/web/app/routes/app.invoicing.tsx

sections:
  - id: header
    component: apps/web/app/features/invoicing/components/InvoicingWorkspace/InvoicingWorkspace.tsx

  - id: kpi-strip
    component: apps/web/app/features/invoicing/components/InvoicingWorkspace/InvoicingWorkspace.tsx
    facts_read:
      - work-log-entries
      - invoices
    figures_shown:
      - invoicing-kpis
      - invoice-totals

  - id: mtd-notice
    component: apps/web/app/features/tax/components/MtdNotice/MtdNotice.tsx
    facts_read:
      - tax-records
      - employment-type
      - rental-share-for-tax
    figures_shown:
      - mtd-qualifying-income

  - id: workspace-tabs
    component: apps/web/app/features/invoicing/components/InvoicingWorkspace/InvoicingWorkspace.tsx

  - id: work-log-panel
    component: apps/web/app/features/invoicing/components/InvoicingWorkspace/InvoicingWorkspace.tsx
    facts_read:
      - work-log-entries
      - invoicing-settings

  - id: invoices-panel
    component: apps/web/app/features/invoicing/components/InvoicingWorkspace/InvoicingWorkspace.tsx
    facts_read:
      - invoices
      - work-log-entries
      - invoicing-settings
    figures_shown:
      - invoice-totals

  - id: settings-panel
    component: apps/web/app/features/invoicing/components/InvoicingWorkspace/InvoicingWorkspace.tsx
    facts_read:
      - invoicing-settings
