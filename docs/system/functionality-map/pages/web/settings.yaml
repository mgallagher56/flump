id: settings
app: web
route: /app/profile
title: Settings
auth: required
purpose: Manage personal details, age and pay, tax basis, net worth choices, monthly check-in day, optional modules, sign-in security, AI connections, data export or deletion, and (only when the backend's household switch is on) a household with one other person.
route_file: apps/web/app/routes/app.profile.tsx

sections:
  - id: header
    component: apps/web/app/features/settings/components/SettingsPage/SettingsPage.tsx

  - id: profile-details
    component: apps/web/app/features/settings/components/ProfileTab/ProfileTab.tsx

  - id: age-and-pay
    component: apps/web/app/features/settings/components/AgeAndPaySection/AgeAndPaySection.tsx
    facts_read:
      - birth-year
      - employment-type
      - salary
      - pension-rates

  - id: tax-basis
    component: apps/web/app/features/settings/components/ProfileTab/ProfileTab.tsx
    facts_read:
      - tax-region
      - student-loan-plan

  - id: net-worth-choices
    component: apps/web/app/features/settings/components/NetWorthChoices/NetWorthChoices.tsx
    facts_read:
      - net-worth-choices

  - id: check-in-day
    component: apps/web/app/features/settings/components/CheckInDaySetting/CheckInDaySetting.tsx
    facts_read:
      - check-in-day

  - id: sections-you-use
    component: apps/web/app/features/settings/components/ProfileTab/ProfileTab.tsx
    facts_read:
      - partner-mode

  - id: security-sign-in
    component: apps/web/app/features/settings/components/SecurityTab/SecurityTab.tsx

  - id: security-invites
    component: apps/web/app/features/settings/components/SecurityTab/SecurityTab.tsx

  - id: ai-connections
    component: apps/web/app/features/ai-connections/components/McpConnectionCard/McpConnectionCard.tsx

  - id: security-imports
    component: apps/web/app/features/settings/components/SecurityTab/SecurityTab.tsx

  - id: data-export
    component: apps/web/app/features/settings/components/DataExportSection/DataExportSection.tsx

  - id: reset-financial-data
    component: apps/web/app/features/settings/components/DataTab/DataTab.tsx

  - id: delete-account
    component: apps/web/app/features/settings/components/DeleteAccountSection/DeleteAccountSection.tsx

  - id: household-membership
    component: apps/web/app/features/household/components/HouseholdTab/HouseholdTab.tsx

  - id: household-invitation
    component: apps/web/app/features/household/components/InvitationLinkPanel/InvitationLinkPanel.tsx

  - id: household-what-i-share
    component: apps/web/app/features/household/components/WhatIShareSection/WhatIShareSection.tsx

  - id: household-joint-summary
    component: apps/web/app/features/household/components/JointSummaryList/JointSummaryList.tsx

  - id: household-leave
    component: apps/web/app/features/household/components/LeaveHouseholdSection/LeaveHouseholdSection.tsx

  - id: household-help-line
    component: apps/web/app/features/household/components/SharingHelpLine/SharingHelpLine.tsx
