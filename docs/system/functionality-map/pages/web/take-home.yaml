id: take-home
app: web
route: /app/take-home
title: Take-home pay
auth: required
purpose: View estimated monthly take-home pay from saved salary, tax region, pension, and student loan settings, inspect deductions, and model a pay rise or marginal tax rate.
route_file: apps/web/app/routes/app.take-home.tsx

sections:
  - id: header
    component: apps/web/app/containers/takeHome/TakeHomeContainer.tsx

  - id: hero-and-kpis
    component: apps/web/app/features/take-home/components/TakeHomeCalculator/TakeHomeCalculator.tsx
    facts_read:
      - salary
      - typed-take-home
      - employment-type
      - tax-region
      - pension-rates
      - student-loan-plan
    figures_shown:
      - take-home

  - id: breakdown
    component: apps/web/app/features/take-home/components/TakeHomeBreakdown/TakeHomeBreakdown.tsx
    facts_read:
      - salary
      - tax-region
      - pension-rates
      - student-loan-plan
    figures_shown:
      - take-home

  - id: scenario-zone
    component: apps/web/app/features/take-home/components/TakeHomeCalculator/TakeHomeCalculator.tsx
    facts_read:
      - salary
      - tax-region
      - pension-rates
      - student-loan-plan
    figures_shown:
      - take-home
