id: dashboard
app: web
route: /
title: Your money
auth: required
purpose: See your net worth, monthly budget summary, setup and check-in prompts, and summaries of each enabled money area.
route_file: apps/web/app/routes/_index.tsx

sections:
  - id: header
    component: apps/web/app/features/dashboard/components/HomeDashboard/HomeDashboard.tsx

  - id: hero
    component: apps/web/app/features/dashboard/components/HomeDashboard/HomeDashboard.tsx
    facts_read:
      - account-balance
      - ownership-share
      - net-worth-choices
      - balance-history
      - home-value
    figures_shown:
      - net-worth
      - net-worth-over-time

  - id: kpis
    component: apps/web/app/features/dashboard/components/DashboardKpiStrip/DashboardKpiStrip.tsx
    facts_read:
      - budget-entries
      - account-balance
      - salary
      - typed-take-home
      - pension-rates
      - tax-region
      - student-loan-plan
      - ownership-share
    figures_shown:
      - home-strip
      - left-over
      - total-debts

  - id: housekeeping
    component: apps/web/app/features/dashboard/components/SetupChecklist/SetupChecklist.tsx
    facts_read:
      - setup-checklist
      - enabled-pages-and-widgets
      - check-in-done
      - check-in-day
      # "Continue check-in" (CH-3): which accounts the check-in has a figure for this month.
      - account-type
      - balance-history

  - id: sections-grid
    component: apps/web/app/features/dashboard/components/HomeDashboard/HomeDashboard.tsx
    facts_read:
      - enabled-pages-and-widgets
      - account-balance
      - budget-entries
      - pension-rates
      - tax-records
    figures_shown:
      - net-worth
      - left-over
      - safe-to-spend
      - months-of-cover
      - total-debts
      - debt-free-date
      - savings-total
      - savings-interest
      - pension-going-in
      - estimated-tax

  - id: visibility-sheet
    component: apps/web/app/features/dashboard/components/WidgetVisibilityPanel/WidgetVisibilityPanel.tsx
    facts_read:
      - enabled-pages-and-widgets
