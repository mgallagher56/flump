facts:
  # ---------- pay ----------
  - id: salary
    name: Salary (yearly pay before tax)
    area: pay
    source_of_truth:
      { ref: user_profiles.annual_salary, path: apps/backend/src/entities/user-profile.entity.ts }
    other_stores:
      - {
          ref: "budget_entries income row",
          status: duplicate,
          path: apps/web/app/services/onboarding-seed.ts,
          note: "a one-off copy of take-home; left over reads this, not the salary",
        }
      - {
          ref: "tax_records category paye_salary",
          status: legacy,
          path: packages/finance-engine/src/tax-calculator.ts,
          note: "an old record replaces the profile salary in tax figures only",
        }
      - {
          ref: "localStorage flump_financial_baseline_v2",
          status: cache,
          path: apps/web/app/state/baseline.store.ts,
          note: "used only when no profile row exists",
        }
      - {
          ref: "cookie and localStorage flump_onboarding_seed",
          status: legacy,
          path: packages/finance-engine/src/persistence.ts,
          note: "numbers typed into public calculators before sign-up",
        }
      - {
          ref: "engine default 45,000",
          status: default,
          path: packages/finance-engine/src/profile.ts,
          note: "display default only; AI output and MCP read saved facts and report no salary as not set",
        }
    writers:
