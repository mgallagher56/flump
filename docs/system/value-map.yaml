# Every browser storage and cookie key the code writes, user data or not. A key that holds a copy of
# a fact names it under fact:. A trailing * means every key with that prefix.
browser_storage:
  - {
      key: flump_financial_baseline_v2,
      storage: localStorage,
      user_data: true,
      fact: salary,
      path: apps/web/app/state/baseline.store.ts,
      note: "the calculator baseline (salary, region and more); the signed-out seed, also read on some signed-in pages",
    }
  - {
      key: flump_financial_baseline_v1,
      storage: localStorage,
      user_data: true,
      fact: salary,
      path: apps/web/app/state/baseline.store.ts,
      note: "the older baseline key; read once, copied to v2 and removed",
    }
  - {
      key: flump_onboarding_seed,
      storage: localStorage,
      user_data: true,
      fact: salary,
      path: packages/finance-engine/src/persistence.ts,
      note: "the marketing calculators' answers (salary, debts, savings) carried into sign-up",
    }
  - {
      key: flump_onboarding_seed,
      storage: cookie,
      user_data: true,
      fact: salary,
      path: packages/finance-engine/src/persistence.ts,
      note: "the same seed as a cookie, kept for one hour so sign-up can finish",
    }
  - {
      key: flump_setup_checklist_dismissed,
      storage: localStorage,
      user_data: true,
      fact: setup-checklist,
      path: apps/web/app/features/dashboard/components/SetupChecklist/SetupChecklist.tsx,
      note: "the setup checklist was dismissed in this browser",
    }
  - {
      key: flump_runway_calculator_settings,
      storage: localStorage,
      user_data: false,
      path: apps/web/app/utils/runwayStorage.ts,
      note: "an account choice older versions saved; now only removed",
    }
  - {
      key: flump.budget.keptDebtRows,
      storage: sessionStorage,
      user_data: false,
      path: apps/web/app/containers/budget/BudgetContainer.tsx,
      note: "ids of budget debt rows the person chose to keep, for this browser session",
    }
  - {
      key: flump-theme,
      storage: localStorage,
      user_data: false,
      path: packages/ui/src/hooks/themeScript.ts,
      note: "light, dark or system",
    }
  - {
      key: flump.setup-step-count,
      storage: sessionStorage,
      user_data: false,
      path: packages/ui/src/hooks/useSetupProgressOnce.ts,
      note: "how many setup steps were done when the progress animation last ran",
    }
  - {
      key: flump.scene-settled.*,
      storage: sessionStorage,
      user_data: false,
      path: packages/ui/src/hooks/useSceneSettle.ts,
      note: "which illustrations have already played their entry animation",
    }
  - {
      key: flump-marketing-scroll,
      storage: sessionStorage,
      user_data: false,
      path: apps/marketing/src/app-shell/ScrollManager.tsx,
      note: "scroll position of each marketing page in history",
    }
  - {
      key: flump_has_session,
      storage: cookie,
      user_data: false,
      path: apps/web/app/security/session-cookies.server.ts,
      note: "a marker the browser code reads to know a session may exist; no session data",
    }
  - {
      key: flump_dev_session,
      storage: cookie,
      user_data: false,
      path: apps/web/app/utils/devSession.server.ts,
      note: "test-only session for the end-to-end suite",
    }
  - {
      key: __Host-wos-session,
      storage: cookie,
      user_data: false,
      path: apps/web/app/utils/sessionPolicy.server.ts,
      note: "the sealed sign-in session in production",
    }
  - {
      key: wos-session,
      storage: cookie,
      user_data: false,
      path: apps/web/app/utils/sessionPolicy.server.ts,
      note: "the sealed sign-in session in development, and the old production name that is cleared",
    }
