    other_stores:
      - {
          ref: "budget_entries income row",
          status: duplicate,
          path: apps/web/app/services/onboarding-seed.ts,
          note: "a one-off copy of take-home; left over reads this, not the salary",
        }
      - {
          ref: "tax_records category paye_salary",
          status: legacy,
          path: packages/finance-engine/src/tax-estimate-inputs.ts,
