# The Flump value map. The only hand-edited file in docs/system.
#
# One entry per stored fact about a user and one per derived figure. Each says where the value
# lives, who writes it, who reads it, which expected links involve it, and the verdict from the
# last audit. Views in docs/system/generated are built from this file:
#
#   bun scripts/generate-value-map.ts          write the views
#   bun scripts/generate-value-map.ts --check  validate ids and paths, and fail on stale views
#
# Rules:
# - Every path must exist in the repository. A path may end in :line.
# - verdict is one of: holds, manual, broken, duplicated, not-checked.
# - A store status is one of: duplicate, cache, derived, legacy, default.
# - Finding ids point at docs/audit/system-2026-11/FINDINGS.md.
# - First version: written by the November 2026 system audit at commit f5631d4f0.
version: 1

